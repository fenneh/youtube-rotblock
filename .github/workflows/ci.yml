name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Install ESLint
        run: npm install eslint@8

      - name: Run ESLint
        run: npx eslint youtube-rotblock-*.js

      - name: Run tests
        run: node --test

  package:
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Create extension package
        run: |
          zip -r youtube-rotblock.zip \
            manifest.json \
            youtube-rotblock-*.js \
            popup.html \
            popup.css \
            icons/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: youtube-rotblock-extension
          path: youtube-rotblock.zip
